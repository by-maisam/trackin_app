{% extends 'base.html' %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md border border-gray-100 max-w-md w-full">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Create Account</h2>
        <p class="text-sm text-gray-500 mt-1">Get started with Trackin asset manager</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Full Name</label>
            <input type="text" name="full_name" required placeholder="John Doe"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" name="email" required placeholder="you@company.com"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit" 
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors mt-2">
            Register
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="text-xs text-gray-500">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 font-medium hover:underline">Log in</a></p>
    </div>
</div>
{% endblock %}
